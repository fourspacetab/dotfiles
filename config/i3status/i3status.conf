# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        colors = true
        interval = 1
}

order += "disk /"
order += "cpu_usage"
order += "memory"
order += "ethernet _first_"
order += "volume master"
order += "tztime local"

disk "/" {
		format = "/: %avail (%percentage_used)"
}

cpu_usage {
		format = "CPU: %usage"
}

memory {
		memory_used_method = "classical"
		format = "RAM: %used (%percentage_used)"
		unit = "MiB"
}

ethernet _first_ {
		format_up = "Connected (Wired Connection)"
		format_down = "Disconnected (%speed)"
}

volume master {
		format = "VOL: %volume"
		format_muted = "VOL: muted (%volume)"
		device = "Default"
		mixer = "Master"
		mixer_idx = 0
}

tztime local {
		format = "%m.%d.%Y %I:%M%p"
}
